name: Deploy Coolify

on:
  push:
    branches:
      - main
      - carlos-stable
      - seo-carlos
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_DEPLOY_URL: http://72.60.50.169:8000/api/v1/deploy?uuid=gva0npycrujvp9z8p1qxwj2g
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "Missing COOLIFY_TOKEN secret."
            exit 1
          fi

          curl --fail --show-error --silent \
            --request GET "$COOLIFY_DEPLOY_URL" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
