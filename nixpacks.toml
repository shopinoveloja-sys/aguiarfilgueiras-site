[staticAssets]
Caddyfile = '''
{
	admin off
	persist_config off
	auto_https off
	log {
		format json
	}
	servers {
		trusted_proxies static private_ranges 100.0.0.0/8
	}
}

:{$PORT:3000} {
	log {
		format json
	}

	rewrite /health /*

	# Do not let scanners or old WordPress-style probes resolve to the SPA homepage.
	# These paths should look absent to external crawlers and security checks.
	@blockedSensitive path_regexp blockedSensitive ^/(?:\.env(?:\..*)?|\.git(?:/.*)?|server-status|wp-admin(?:/.*)?|wp-login\.php|xmlrpc\.php|wp-content(?:/.*)?|wp-includes(?:/.*)?|wp-json(?:/.*)?)$
	respond @blockedSensitive 404

	# Preserve the authority of URLs from the former WordPress site.
	redir /areas-de-atuacao/direito-penal-militar /direito-penal-militar/ permanent
	redir /areas-de-atuacao/direito-penal-militar/ /direito-penal-militar/ permanent
	redir /areas-de-atuacao/direito-administrativo-militar /processo-administrativo-militar/ permanent
	redir /areas-de-atuacao/direito-administrativo-militar/ /processo-administrativo-militar/ permanent
	redir /areas-de-atuacao/direito-disciplinar-militar /punicao-disciplinar-militar/ permanent
	redir /areas-de-atuacao/direito-disciplinar-militar/ /punicao-disciplinar-militar/ permanent
	redir /areas-de-atuacao/saude-incapacidade-reforma-militar /reforma-militar-por-invalidez/ permanent
	redir /areas-de-atuacao/saude-incapacidade-reforma-militar/ /reforma-militar-por-invalidez/ permanent
	redir /areas-de-atuacao/pensao-militar-familiares /pensao-militar/ permanent
	redir /areas-de-atuacao/pensao-militar-familiares/ /pensao-militar/ permanent
	redir /o-escritorio /#fundador permanent
	redir /o-escritorio/ /#fundador permanent
	redir /404 / permanent
	redir /404/ / permanent

	# Keep one canonical URL format for every HTML route.
	@missingSlash path_regexp missingSlash ^/[^.?]*[^/]$
	redir @missingSlash {path}/ permanent

	root * ../app/{$NIXPACKS_SPA_OUTPUT_DIR}
	encode gzip
	file_server
	header {
		X-Content-Type-Options "nosniff"
		Referrer-Policy "strict-origin-when-cross-origin"
		X-Frame-Options "SAMEORIGIN"
		Permissions-Policy "camera=(), microphone=(), geolocation=()"
	}

	@assets {
		path_regexp assets \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2)$
	}
	header @assets Cache-Control "public, max-age=31536000, immutable"

	@html {
		path *.html
		path /
		path /blog*
		path /advogado*
		path /abate*
		path /conselho*
		path /desercao*
		path /defesa*
		path /direito*
		path /exclusao*
		path /junta*
		path /links*
		path /processo*
		path /promocao*
		path /reforma*
		path /sindicancia*
		path /licenciamento*
		path /pensao*
		path /bio*
	}
	header @html Cache-Control "no-cache, no-store, must-revalidate"
	header @html Pragma "no-cache"
	header @html Expires "0"

	try_files {path} {path}/index.html /index.html
}
'''
